<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="nhimc-test-result" content="RUNNING">
  <title>NHIMC UI Core browser tests</title>
  <link rel="stylesheet" href="../../src/themes/nhimc-light.css">
  <link rel="stylesheet" href="../../src/themes/nhimc-fonts.css">
  <link rel="stylesheet" href="../../src/components/components.css">
  <style>
    html, body { margin: 0; max-width: 100%; overflow-x: clip; }
    iframe { display: block; width: 100%; max-width: 100%; height: 42rem; border: 0; }
  </style>
</head>
<body>
  <div id="results">RUNNING</div>
  <section id="component-specimens" aria-label="Component specimens">
    <button id="disabled-button" class="nhimc-button" type="button" disabled>Unavailable</button>
    <label>Notifications <input id="test-switch" class="nhimc-switch" type="checkbox" role="switch"></label>
    <label>Notes <textarea class="nhimc-textarea"></textarea></label>
    <label>State <select class="nhimc-select"><option>Active</option></select></label>
    <label><input class="nhimc-checkbox" type="checkbox"> Enabled</label>
    <fieldset><legend>Choice</legend><label><input class="nhimc-radio" type="radio" name="test-choice"> One</label></fieldset>
    <label>Date <input class="nhimc-date-input" type="date"></label>
    <form class="nhimc-search" role="search"><input class="nhimc-input" aria-label="Search"><button class="nhimc-button" type="submit">Search</button></form>
    <article class="nhimc-card"><h2>Card title</h2><p>Card content</p></article>
    <span class="nhimc-badge">Active</span>
    <span class="nhimc-status" role="status" data-status="warning">Review needed</span>
    <table class="nhimc-table"><caption>Test items</caption><thead><tr><th scope="col">Name</th></tr></thead><tbody><tr><td>Example</td></tr></tbody></table>
    <nav aria-label="Test pagination"><ol class="nhimc-pagination"><li><a href="#page-1" aria-current="page">1</a></li></ol></nav>
    <svg class="nhimc-icon" aria-hidden="true"><use href="../../src/assets/icons/nhimc-icons.svg#home"></use></svg>
    <div class="nhimc-field">
      <label for="account-name">Account name</label>
      <input id="account-name" class="nhimc-input" aria-invalid="true" aria-describedby="account-error">
      <span id="account-error" class="nhimc-field-message" data-error>Enter an account name.</span>
    </div>
    <div class="nhimc-tabs" role="tablist" aria-label="Test views">
      <button id="tab-one" class="nhimc-tab" type="button" role="tab" aria-selected="true" aria-controls="panel-one">One</button>
      <button id="tab-two" class="nhimc-tab" type="button" role="tab" aria-selected="false" aria-controls="panel-two" tabindex="-1">Two</button>
    </div>
    <section id="panel-one" role="tabpanel" aria-labelledby="tab-one">First panel</section>
    <section id="panel-two" role="tabpanel" aria-labelledby="tab-two" hidden>Second panel</section>
    <button id="dialog-opener" class="nhimc-button" type="button" data-nhimc-dialog-open="test-dialog">Open details</button>
    <dialog id="test-dialog" class="nhimc-dialog" aria-labelledby="dialog-title">
      <header><h2 id="dialog-title">Details</h2></header>
      <div class="nhimc-dialog-body">Dialog content</div>
      <footer><button id="dialog-close" class="nhimc-button" type="button" data-nhimc-dialog-close autofocus>Close</button></footer>
    </dialog>
  </section>
  <script type="module" src="./runner.js"></script>
</body>
</html>
