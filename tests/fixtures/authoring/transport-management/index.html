<!doctype html>
<html lang="ko" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일산병원 이송업무 관리</title></head>
<body>
<nhimc-frame id="app-frame" data-frame="left" data-template="list-default" data-project-title="일산병원 이송업무 관리" data-active-id="transport">
<main data-nhimc-template-root="list-default" data-nhimc-role="content">
  <section class="heading" data-nhimc-role="page-header" data-nhimc-component="PageHeader"><div><h1>병원 이송업무 관리</h1><p>이송 신청, 배정, 진행 상태와 완료 내역을 한 화면에서 관리합니다.</p></div><button class="btn primary" data-nhimc-component="Button" type="button">이송 신청</button></section>
  <section class="toolbar" data-nhimc-role="search-filter" data-nhimc-component="SearchFilter" aria-label="이송 요청 조회 조건">
    <div class="field"><label for="transport-keyword">요청 번호·부서</label><input data-nhimc-component="Input" id="transport-keyword" type="search" placeholder="요청 번호 또는 부서 입력"></div>
    <div class="field"><label for="transport-status">이송 상태</label><select data-nhimc-component="Select" id="transport-status"><option>전체 상태</option><option>배정 대기</option><option>배정 완료</option><option>이송 중</option><option>이송 완료</option></select></div>
    <button class="btn primary" data-nhimc-component="Button" data-nhimc-role="search-filter-query" type="button">조회</button><button class="btn ghost-subtle" data-nhimc-component="Button" data-nhimc-role="search-filter-reset" type="button">초기화</button>
  </section>
  <section class="card" data-nhimc-role="data-table" data-nhimc-component="DataTable">
    <div class="card-head"><strong>이송 요청 목록</strong><span aria-live="polite">총 4건</span></div>
    <p class="status-indicator" data-screen-state="loading" hidden>로딩 중</p><p class="status-indicator" data-screen-state="empty" hidden>조회 결과가 없습니다</p><p class="status-indicator bad" data-screen-state="error" hidden>조회 중 오류가 발생했습니다</p>
    <div class="table-wrap"><table data-nhimc-component="Table"><caption>시연용 이송 요청과 배정 상태</caption><thead><tr><th scope="col">요청 번호</th><th scope="col">요청 시각</th><th scope="col">출발지</th><th scope="col">도착지</th><th scope="col">이송 수단</th><th scope="col">상태</th><th scope="col">담당</th></tr></thead><tbody><tr tabindex="0" data-request-id="T-260928-01"><td>T-260928-01</td><td>09:10</td><td>외래진료실</td><td>영상의학과</td><td>휠체어</td><td><span class="badge warn" data-nhimc-component="Badge">배정 대기</span></td><td>미배정</td></tr><tr tabindex="0" data-request-id="T-260928-02"><td>T-260928-02</td><td>09:18</td><td>건강검진센터</td><td>병동</td><td>이송침대</td><td><span class="badge ok" data-nhimc-component="Badge">배정 완료</span></td><td>이송팀 2</td></tr><tr tabindex="0" data-request-id="T-260928-03"><td>T-260928-03</td><td>09:26</td><td>응급실</td><td>검사실</td><td>이송침대</td><td><span class="badge" data-nhimc-component="Badge">이송 중</span></td><td>이송팀 1</td></tr></tbody></table></div>
    <div class="pager" data-nhimc-role="pagination" data-nhimc-component="PaginationArea Pagination"><button data-nhimc-component="Pagination" type="button" aria-label="이전 페이지">이전</button><button data-nhimc-component="Pagination" type="button" aria-current="page">1</button><button data-nhimc-component="Pagination" type="button">2</button><button data-nhimc-component="Pagination" type="button" aria-label="다음 페이지">다음</button></div>
    <dialog class="dialog-box" data-nhimc-component="Dialog" id="transport-detail" aria-labelledby="transport-detail-title"><div class="dialog-head"><strong id="transport-detail-title">이송 요청 상세</strong><button class="icon-btn" type="button" data-detail-close aria-label="상세 창 닫기">닫기</button></div><div class="dialog-body"><p data-detail-value>요청을 선택하세요.</p></div></dialog>
  </section>
</main>
</nhimc-frame>
<script type="application/json" data-nhimc-menu>[{"id":"transport","label":"이송 현황","icon":"ambulance","href":"#transport"}]</script>
<script type="module" data-nhimc-business>
const detail=document.querySelector('#transport-detail');
document.querySelectorAll('[data-request-id]').forEach(row=>row.addEventListener('click',()=>{document.querySelector('[data-detail-value]').textContent=row.dataset.requestId+' 요청의 배정 상세입니다.';detail.showModal();}));
document.querySelector('[data-detail-close]')?.addEventListener('click',()=>detail.close());
document.querySelector('[data-nhimc-role="search-filter-reset"]')?.addEventListener('click',()=>{document.querySelector('#transport-keyword').value='';document.querySelector('#transport-status').selectedIndex=0;});
</script>
</body></html>
