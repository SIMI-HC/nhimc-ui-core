<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">

<main data-nhimc-role="content">
<div class="nhimc-page-header">

  <div class="nhimc-actions"><button class="btn primary" type="button" data-nhimc-component="Button">이송 요청 등록</button></div>
</div>

<section class="card nhimc-card" data-nhimc-component="ContentCard SearchFilter">
  <div class="nhimc-card-head"><strong>조회 조건</strong></div>
  <div class="nhimc-card-body">
    <div class="nhimc-toolbar">
      <label class="field"><span>이송일</span><input type="date" value="2026-10-07"></label><label class="field"><span>환자명</span><input type="text" placeholder="환자명 입력"></label><label class="field"><span>이송상태</span><select><option>전체</option><option>대기</option><option>이송중</option><option>완료</option></select></label><label class="field"><span>출발병동</span><select><option>전체</option><option>1병동</option><option>2병동</option><option>응급의료센터</option></select></label>
      <div class="nhimc-toolbar-end"><button class="btn ghost" type="button" data-nhimc-component="Button">초기화</button><button class="btn primary" type="button" data-nhimc-component="Button">조회</button></div>
    </div>
  </div>
</section>

<div class="nhimc-grid nhimc-stat-grid">
  <section class="card nhimc-card nhimc-stat" data-nhimc-accent="sky" data-nhimc-component="Stat">
    <div class="nhimc-card-head"><strong>전체 요청</strong></div>
    <div class="nhimc-card-body nhimc-stat-body"><p class="nhimc-stat-value">37<span class="nhimc-stat-unit">건</span></p><small class="nhimc-stat-note">오늘 접수</small></div>
  </section>
  <section class="card nhimc-card nhimc-stat" data-nhimc-accent="yellow" data-nhimc-component="Stat">
    <div class="nhimc-card-head"><strong>이송 대기</strong></div>
    <div class="nhimc-card-body nhimc-stat-body"><p class="nhimc-stat-value">8<span class="nhimc-stat-unit">건</span></p><small class="nhimc-stat-note">배정 대기</small></div>
  </section>
  <section class="card nhimc-card nhimc-stat" data-nhimc-accent="apricot" data-nhimc-component="Stat">
    <div class="nhimc-card-head"><strong>이송 중</strong></div>
    <div class="nhimc-card-body nhimc-stat-body"><p class="nhimc-stat-value">5<span class="nhimc-stat-unit">건</span></p><small class="nhimc-stat-note">현재 이송</small></div>
  </section>
  <section class="card nhimc-card nhimc-stat" data-nhimc-accent="pear" data-nhimc-component="Stat">
    <div class="nhimc-card-head"><strong>완료</strong></div>
    <div class="nhimc-card-body nhimc-stat-body"><p class="nhimc-stat-value">24<span class="nhimc-stat-unit">건</span></p><small class="nhimc-stat-note">정상 처리</small></div>
  </section>
</div>

<section class="card nhimc-card" data-nhimc-component="ContentCard DataTable">
  <div class="nhimc-card-head">
    <strong>이송 요청 목록</strong>
    <div class="nhimc-card-head-end"><span>총 37건</span><button class="btn" type="button" data-nhimc-component="Button">새로고침</button></div>
  </div>
  <div class="nhimc-scroll">
    <table data-nhimc-component="Table" aria-label="이송 요청 목록">
      <thead><tr><th>접수번호</th><th>환자명</th><th>출발</th><th>도착</th><th>요청시간</th><th>이송수단</th><th>담당자</th><th>상태</th></tr></thead>
      <tbody>
        <tr><td>TR-20261007-0037</td><td>김○○</td><td>3병동</td><td>영상의학과</td><td>10:21</td><td>휠체어</td><td>박○○</td><td><span class="badge ok">완료</span></td></tr>
        <tr><td>TR-20261007-0036</td><td>이○○</td><td>2병동</td><td>CT실</td><td>10:18</td><td>환자이송카트</td><td>최○○</td><td><span class="badge warn">이송중</span></td></tr>

      </tbody>
    </table>
  </div>
  <div class="nhimc-pagination" data-nhimc-role="pagination" data-nhimc-component="PaginationArea">
    <nav class="pages" data-nhimc-component="Pagination" aria-label="페이지 이동"><button type="button" aria-label="이전 페이지">이전</button><button type="button" class="on" aria-current="page">1</button><button type="button">2</button><button type="button" aria-label="다음 페이지">다음</button></nav>
  </div>
</section>
</main>
