<!doctype html>
<html lang="ko" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>병원 이송업무 관리</title></head>
<body>
<nhimc-frame id="app-frame" data-frame="left" data-project-title="병원 이송업무 관리" data-active-id="ambulance">
<main data-nhimc-role="content">
  <section class="nhimc-page-header" data-nhimc-role="page-header" data-nhimc-component="PageHeader"><div><h1>이송 현황</h1><p>일산병원 환자 이송 요청과 배정 현황을 확인합니다.</p></div><div class="nhimc-actions"><button class="btn primary" data-nhimc-component="Button" type="button">이송 신청</button></div></section>
  <section class="nhimc-toolbar" data-nhimc-role="search-filter" data-nhimc-component="SearchFilter Toolbar" aria-label="조회 조건">
    <label class="field" data-nhimc-component="Field" for="ops-keyword">요청 번호·부서<input data-nhimc-component="Input" id="ops-keyword" type="search" placeholder="요청 번호 또는 부서 입력"></label>
    <label class="field" data-nhimc-component="Field" for="ops-status">이송 상태<select data-nhimc-component="Select" id="ops-status"><option>전체 상태</option><option>배정 대기</option><option>배정 완료</option><option>이송 중</option></select></label>
    <div class="nhimc-toolbar-end"><button class="btn primary" data-nhimc-component="Button" data-nhimc-role="search-filter-query" type="button">조회</button><button class="btn ghost-subtle" data-nhimc-component="Button" data-nhimc-role="search-filter-reset" type="button">초기화</button></div>
  </section>
  <section class="card nhimc-card" data-nhimc-role="data-table" data-nhimc-component="DataTable ContentCard Card">
    <div class="nhimc-card-head"><strong>이송 요청 목록</strong><div class="nhimc-card-head-end"><span aria-live="polite">총 2건</span><button class="btn" type="button" data-nhimc-component="Button">새로고침</button></div></div>
    <div data-screen-states hidden><p class="status-indicator" data-screen-state="loading" data-nhimc-component="StatusIndicator"><span class="dot" aria-hidden="true"></span><span>로딩 중</span></p><div class="empty" data-screen-state="empty" data-nhimc-component="Empty"><strong>조회 결과가 없습니다.</strong><p>조건을 변경하고 다시 조회해 보세요.</p></div><div class="alert" data-screen-state="error" data-nhimc-component="Alert"><strong>조회 중 오류가 발생했습니다.</strong></div></div>
    <div class="nhimc-scroll"><table data-nhimc-component="Table"><caption>환자 개인정보가 아닌 시연용 이송 목록</caption><thead><tr><th scope="col">요청 번호</th><th scope="col">출발지</th><th scope="col">도착지</th><th scope="col">상태</th><th scope="col">담당</th></tr></thead><tbody><tr tabindex="0" data-request-id="T-2401"><td>T-2401</td><td>외래진료실</td><td>영상의학과</td><td><span class="badge warn" data-nhimc-component="Badge">배정 대기</span></td><td>미배정</td></tr><tr tabindex="0" data-request-id="T-2402"><td>T-2402</td><td>건강검진센터</td><td>병동</td><td><span class="badge ok" data-nhimc-component="Badge">이송 중</span></td><td>이송팀 2</td></tr></tbody></table></div>
    <div class="nhimc-pagination" data-nhimc-role="pagination" data-nhimc-component="PaginationArea"><nav class="pages" data-nhimc-component="Pagination" aria-label="페이지 이동"><button type="button" aria-label="이전 페이지">이전</button><button type="button" class="on" aria-current="page">1</button><button type="button">2</button><button type="button" aria-label="다음 페이지">다음</button></nav></div>
  </section>
</main>
</nhimc-frame>
<script type="application/json" data-nhimc-menu>[{"id":"ambulance","label":"이송 현황","icon":"ambulance","href":"#ambulance"}]</script>
<script type="module" data-nhimc-business>
document.querySelector('[data-nhimc-role="search-filter-reset"]')?.addEventListener('click',()=>{document.querySelector('#ops-keyword').value='';document.querySelector('#ops-status').selectedIndex=0;});
</script>
</body></html>
