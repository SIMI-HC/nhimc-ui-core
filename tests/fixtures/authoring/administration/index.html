<!doctype html>
<html lang="ko" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>병원 권한 관리</title></head>
<body>
<nhimc-frame id="app-frame" data-frame="left" data-template="admin-master-detail" data-project-title="병원 권한 관리" data-active-id="roles">
<main data-nhimc-template-root="admin-master-detail" data-nhimc-role="content">
  <section class="heading" data-nhimc-role="page-header" data-nhimc-component="PageHeader"><div><h1>역할 관리</h1><p>병원 업무 역할과 권한을 관리합니다.</p></div></section>
  <section class="master-detail" data-nhimc-role="master-detail" data-nhimc-component="MasterDetail">
    <aside class="card master" data-nhimc-role="master-list" data-nhimc-component="Card SearchFilter Input"><label class="field" for="role-search">역할 검색</label><input id="role-search" type="search"><button class="btn" type="button">이송 관리자</button></aside>
    <section class="card detail" data-nhimc-role="detail-panel" data-nhimc-component="Card CheckboxGroup CheckboxField Checkbox ConfirmAction Button">
      <h2>이송 관리자 <span class="badge ok">사용 중</span></h2><fieldset class="choice-group"><legend>허용 업무</legend><label class="check"><input type="checkbox" checked> <span>이송 요청 조회</span></label><label class="check"><input type="checkbox" checked> <span>이송 배정</span></label><label class="check"><input type="checkbox"> <span>완료 내역 삭제</span></label></fieldset>
      <div class="actions row" data-nhimc-role="action-area" data-nhimc-component="ActionArea Button"><button class="btn primary" type="button">변경 저장</button></div>
    </section>
  </section>
</main>
</nhimc-frame>
<script type="application/json" data-nhimc-menu>[{"id":"roles","label":"역할 관리","icon":"user-check","href":"#roles"}]</script>
</body></html>
